<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本地推理控制台</title>
<style>
  :root{
    --bg:#0f1216; --panel:#171c22; --panel2:#1e252d; --line:#2a333d;
    --fg:#e6edf3; --dim:#8b98a5; --accent:#3fb950; --accent2:#2f81f7;
    --warn:#d29922; --err:#f85149; --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  a{color:var(--accent2)}
  .wrap{max-width:1180px;margin:0 auto;padding:20px}

  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:19px;margin:0;font-weight:600}
  .spacer{flex:1}
  .badge{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;
         border:1px solid transparent;white-space:nowrap}
  .s-running{background:rgba(63,185,80,.15);color:var(--accent);border-color:rgba(63,185,80,.4)}
  .s-loading{background:rgba(210,153,34,.15);color:var(--warn);border-color:rgba(210,153,34,.4)}
  .s-error{background:rgba(248,81,73,.15);color:var(--err);border-color:rgba(248,81,73,.4)}
  .s-idle{background:rgba(139,152,165,.15);color:var(--dim);border-color:var(--line)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
         padding:16px;margin-bottom:16px}
  .panel h2{font-size:14px;margin:0 0 12px;color:var(--dim);font-weight:600;
            text-transform:uppercase;letter-spacing:.5px}

  .grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
  .stat .k{font-size:12px;color:var(--dim)}
  .stat .v{font-size:16px;font-weight:600;margin-top:2px;word-break:break-all}
  .stat .v small{font-size:12px;color:var(--dim);font-weight:400}

  .models{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);
        padding:15px;display:flex;flex-direction:column;gap:9px;transition:.15s}
  .card:hover{border-color:#3a4654}
  .card.active{border-color:var(--accent);box-shadow:0 0 0 1px rgba(63,185,80,.35)}
  .card.warn{border-color:rgba(210,153,34,.5)}
  .card h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tag{font-size:11px;padding:1px 7px;border-radius:5px;background:#2b3542;color:var(--dim);font-weight:500}
  .tag.ok{background:rgba(63,185,80,.18);color:var(--accent)}
  .tag.warn{background:rgba(210,153,34,.18);color:var(--warn)}
  .fname{font-size:11.5px;color:var(--dim);word-break:break-all;font-family:ui-monospace,Consolas,monospace}
  .note{font-size:12.5px;color:var(--dim)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px}
  .kv .k{color:var(--dim)}
  .card .actions{margin-top:auto;display:flex;gap:8px;padding-top:4px}

  button{font:inherit;padding:7px 14px;border-radius:7px;border:1px solid var(--line);
         background:#242c35;color:var(--fg);cursor:pointer;transition:.15s}
  button:hover:not(:disabled){background:#2d3742;border-color:#3d4a58}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:600}
  button.primary:hover:not(:disabled){background:#4a94f8}
  button.danger{background:#3a2226;border-color:#5c3038;color:#ff9a94}
  button.danger:hover:not(:disabled){background:#4a2a30}

  .bar{height:4px;border-radius:2px;background:#242c35;overflow:hidden;margin-top:8px}
  .bar>i{display:block;height:100%;width:30%;background:var(--warn);
         animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}

  pre{background:#0b0e12;border:1px solid var(--line);border-radius:8px;padding:12px;
      overflow:auto;max-height:340px;font-size:12px;margin:0;
      font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;white-space:pre-wrap;word-break:break-all}
  .muted{color:var(--dim);font-size:12.5px}
  .toast{position:fixed;right:20px;bottom:20px;background:var(--panel2);border:1px solid var(--line);
         border-left:3px solid var(--err);border-radius:8px;padding:12px 16px;max-width:460px;
         box-shadow:0 8px 28px rgba(0,0,0,.5);display:none;z-index:50}
  .toast.show{display:block}
  details summary{cursor:pointer;color:var(--dim);font-size:12.5px;user-select:none}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  /* ---------- 数据仪表盘 ---------- */
  .dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
  .tile{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);
        padding:14px 15px}
  .tile h4{margin:0 0 10px;font-size:12px;color:var(--dim);font-weight:600;
           text-transform:uppercase;letter-spacing:.5px;display:flex;
           align-items:center;justify-content:space-between}
  .big{font-size:27px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
  .big small{font-size:12.5px;color:var(--dim);font-weight:400;margin-left:4px}
  .sub{font-size:12px;color:var(--dim);margin-top:4px}
  .g{color:var(--accent)} .b{color:var(--accent2)} .w{color:var(--warn)} .e{color:var(--err)}
  .dim{color:var(--fg);opacity:.45}
  .meter{height:7px;border-radius:4px;background:#242c35;overflow:hidden;margin:9px 0 5px}
  .meter>i{display:block;height:100%;border-radius:4px;background:var(--accent2);
           transition:width .4s ease}
  .meter>i.ok{background:var(--accent)} .meter>i.warn{background:var(--warn)}
  .meter>i.hot{background:var(--err)}
  .legend{display:flex;gap:12px;font-size:11.5px;color:var(--dim);margin-top:2px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
  .mini{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px}
  .mini .k{color:var(--dim);white-space:nowrap}
  .mini .v{font-variant-numeric:tabular-nums;text-align:right}
  canvas{width:100%;height:96px;display:block}
  .tile.wide{grid-column:1/-1}
  .kvtag{font-size:11px;padding:1px 7px;border-radius:5px;background:#2b3542;color:var(--dim)}

  /* ---------- 视觉开关 ---------- */
  .switch{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim);
          cursor:pointer;user-select:none}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .switch .track{position:relative;width:36px;height:20px;border-radius:999px;flex:none;
                 background:#2b3542;border:1px solid var(--line);transition:.15s}
  .switch .track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;
                        border-radius:50%;background:#8b98a5;transition:.15s}
  .switch input:checked + .track{background:rgba(63,185,80,.35);border-color:var(--accent)}
  .switch input:checked + .track::after{left:18px;background:var(--accent)}
  .switch input:disabled + .track{opacity:.45;cursor:not-allowed}

  /* ---------- 扫描目录：chips + 选择器 ---------- */
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);
        border-radius:7px;padding:4px 6px 4px 10px;font-size:12px;max-width:340px;
        font-family:ui-monospace,Consolas,monospace}
  .chip>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip b{cursor:pointer;color:var(--err);font-weight:700;padding:0 4px;flex:none}
  .chip b:hover{background:rgba(248,81,73,.15);border-radius:4px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;
         align-items:center;justify-content:center;z-index:60}
  .modal.show{display:flex}
  .modal-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
             width:min(680px,92vw);max-height:84vh;display:flex;flex-direction:column;
             padding:16px;gap:10px}
  .modal-box h3{margin:0;font-size:15px}
  .modal-box input{flex:1;min-width:180px;font:inherit;font-size:13px;font-family:ui-monospace,Consolas,monospace;
                   padding:7px 10px;border-radius:7px;border:1px solid var(--line);background:#0b0e12;color:var(--fg)}
  .pick-list{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#0b0e12;min-height:140px}
  .pick-list .item{padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #141a20;
                   display:flex;align-items:center;gap:8px}
  .pick-list .item:hover{background:#171c22}
  .pick-list .none{padding:16px;color:var(--dim);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>本地推理控制台</h1>
    <span id="badge" class="badge s-idle">连接中…</span>
    <span class="spacer"></span>
    <button id="btn-rescan">重新扫描</button>
    <button id="btn-key">API Key</button>
    <button id="btn-stop" class="danger">停止服务</button>
    <a href="/docs" target="_blank" rel="noopener noreferrer"><button>API 文档</button></a>
  </header>

  <div class="panel">
    <h2>当前状态</h2>
    <div class="grid-stats">
      <div class="stat"><div class="k">模型</div><div class="v" id="s-model">—</div></div>
      <div class="stat"><div class="k">上下文</div><div class="v" id="s-ctx">—</div></div>
      <div class="stat"><div class="k">ubatch</div><div class="v" id="s-ub">—</div></div>
      <div class="stat"><div class="k">KV cache</div><div class="v" id="s-kv">—</div></div>
      <div class="stat"><div class="k">专家权重</div><div class="v" id="s-moe">—</div></div>
      <div class="stat"><div class="k">显存空闲</div><div class="v" id="s-vram">—</div></div>
      <div class="stat"><div class="k">加载模式</div><div class="v" id="s-load">—</div></div>
      <div class="stat"><div class="k">运行时长</div><div class="v" id="s-up">—</div></div>
    </div>
    <div id="progress" style="display:none">
      <div class="bar"><i></i></div>
      <div class="muted" id="progress-msg" style="margin-top:6px"></div>
    </div>
    <div id="errbox" style="display:none;margin-top:12px">
      <div class="muted" style="color:var(--err)" id="errmsg"></div>
    </div>
    <div id="idlebox" style="display:none;margin-top:12px">
      <div class="muted" style="color:var(--warn)">
        当前没有加载任何模型。在下面的「可用模型」里选一个，点<b>「启动此模型」</b>即可。
      </div>
    </div>
    <details style="margin-top:12px">
      <summary>启动命令行 / 后端日志</summary>
      <div class="row" style="margin:10px 0">
        <button id="btn-copy">复制 API 地址</button>
        <button id="btn-log">刷新日志</button>
      </div>
      <div class="muted" style="margin-bottom:6px">命令行</div>
      <pre id="cmdline">—</pre>
      <div class="muted" style="margin:10px 0 6px">日志尾部</div>
      <pre id="log">（点「刷新日志」）</pre>
    </details>
  </div>

  <div class="panel">
    <h2>实时数据 <span class="muted" id="dash-updated"></span></h2>
    <div class="dash" id="dash">
      <div class="muted">等待第一个采样…（CPU 占用需要两次采样，约 2 秒后出现）</div>
    </div>
  </div>

  <div class="panel">
    <h2>可用模型 <span class="muted" id="roots"></span></h2>
    <div class="row" id="roots-bar" style="margin-bottom:12px"></div>
    <div class="models" id="models"><div class="muted">正在扫描…</div></div>
  </div>

</div>

<div class="modal" id="picker">
  <div class="modal-box">
    <h3>选择模型目录</h3>
    <div class="row">
      <button id="pick-up" title="上一级">↑ 上级</button>
      <input id="pick-path" placeholder="直接输入路径，例如 D:\models">
      <button id="pick-go">转到</button>
    </div>
    <div class="pick-list" id="pick-list"><div class="none">正在读取…</div></div>
    <div class="row" style="justify-content:flex-end">
      <button id="pick-cancel">取消</button>
      <button class="primary" id="pick-add">添加当前目录</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let MODELS = [];
let STATUS = {};
let ROOTS = [];            // 当前扫描目录
let PICK_PARENT = '';      // 目录选择器里"上级"指向
let pollTimer = null;
let polling = false;
let VISION_SYNCED = null;  // 已经按运行结果回填过视觉开关的模型路径

/* ---------- API Key（服务端启用鉴权时用） ---------- */
function getKey(){ return localStorage.getItem('llm_api_key') || ''; }
function setKey(k){
  if(k) localStorage.setItem('llm_api_key', k);
  else localStorage.removeItem('llm_api_key');
}
function authHeaders(extra){
  const k = getKey();
  const h = Object.assign({}, extra || {});
  if(k) h['Authorization'] = 'Bearer ' + k;
  return h;
}
/* 包一层 fetch：401 时提示输入 Key 并重试一次 */
async function api(url, opts){
  opts = opts || {};
  opts.headers = authHeaders(opts.headers);
  let r = await fetch(url, opts);
  if(r.status === 401){
    const k = prompt('该服务启用了 API Key，请输入（留空则取消）：', getKey());
    if(k === null) return r;
    setKey(k.trim());
    opts.headers = authHeaders(opts.headers);
    r = await fetch(url, opts);
  }
  return r;
}

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 7000);
}
function fmtUptime(s){
  if(!s) return '—';
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60);
  return h ? `${h}h ${m}m` : (m ? `${m}m ${Math.floor(s%60)}s` : `${Math.floor(s)}s`);
}
function stateBadge(st){
  const map = {running:['运行中','s-running'], loading:['加载中','s-loading'],
               error:['出错','s-error'], idle:['未加载模型','s-idle']};
  const [text,cls] = map[st] || ['未知','s-idle'];
  const b = $('badge'); b.textContent = text; b.className = 'badge ' + cls;
}

async function fetchStatus(){
  try{
    const r = await api('/admin/status');
    STATUS = await r.json();
  }catch(e){ STATUS = {state:'error', message:'控制台连不上后端：'+e}; }
  renderStatus();
}

/* ================= 实时数据仪表盘 ================= */
let LAST_METRICS = null;

async function fetchMetrics(){
  try{
    const r = await api('/admin/metrics');
    LAST_METRICS = await r.json();
  }catch(e){ LAST_METRICS = null; }
  renderDash(LAST_METRICS);
}

function n(v, d){ return (v===null||v===undefined||isNaN(v)) ? '—' : Number(v).toFixed(d===undefined?1:d); }
function gi(v, d){ return (v===null||v===undefined) ? '—' : Number(v).toFixed(d===undefined?2:d) + ' GiB'; }
function baseName(p){ return String(p||'').split(/[\\/]/).pop(); }
function meterClass(p){ return p>=90?'hot':(p>=70?'warn':'ok'); }
function meter(p, label){
  const v = Math.max(0, Math.min(100, p||0));
  return `<div class="meter"><i class="${meterClass(v)}" style="width:${v}%"></i></div>
          <div class="sub">${label||''}</div>`;
}
function tile(title, body, tag){
  return `<div class="tile"><h4>${title}${tag?`<span class="kvtag">${tag}</span>`:''}</h4>${body}</div>`;
}

function renderDash(m){
  const box = $('dash');
  if(!m){ box.innerHTML = '<div class="muted">拿不到运行时数据（后端可能正在加载）。</div>'; return; }
  const sys = m.system||{}, be = m.backend||{}, gw = m.gateway||{};
  const gpu = (sys.gpus||[])[0] || null;
  const mem = sys.memory || {};
  const proc = sys.process || {};
  const live = be.live || {}, avg = be.avg || {};

  $('dash-updated').textContent = '· ' + new Date((m.ts||0)*1000).toLocaleTimeString();

  /* --- 1. 实时吞吐 --- */
  // 两次采样之间没有请求时，增量算不出速度。这时回落到累计均值并标注，
  // 避免数字在 "37.2" 和 "—" 之间来回闪。
  const decLive = live.decode_tps, preLive = live.prefill_tps;
  const decVal = decLive ?? avg.decode_tps, preVal = preLive ?? avg.prefill_tps;
  const decDim = decLive == null, preDim = preLive == null;
  const speedTile = `
    <div style="display:flex;gap:24px;flex-wrap:wrap">
      <div><div class="sub">decode ${decDim?'（空闲，显示均值）':''}</div>
        <div class="big ${decDim?'dim':'g'}">${n(decVal,2)}<small>tok/s</small></div></div>
      <div><div class="sub">prefill ${preDim?'（空闲，显示均值）':''}</div>
        <div class="big ${preDim?'dim':'b'}">${n(preVal,1)}<small>tok/s</small></div></div>
    </div>
    <canvas id="chart" width="600" height="96" style="margin-top:8px"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>decode</span>
      <span><i style="background:var(--accent2)"></i>prefill（同一坐标轴）</span>
      <span style="margin-left:auto">有请求时显示实时值，空闲回落到均值</span>
    </div>`;

  /* --- 2. GPU --- */
  const gpuTile = gpu ? `
    <div class="big">${n(gpu.used_gib,2)}<small>/ ${n(gpu.total_gib,1)} GiB</small></div>
    ${meter(gpu.used_percent, `显存占用 ${n(gpu.used_percent,1)}%　空闲 ${n(gpu.free_gib,2)} GiB`)}
    <div class="mini" style="margin-top:8px">
      <span class="k">GPU 利用率</span><span class="v">${n(gpu.util_percent,0)}%</span>
      <span class="k">显存带宽占用</span><span class="v">${n(gpu.mem_util_percent,0)}%</span>
      <span class="k">温度 / 功耗</span><span class="v">${n(gpu.temp_c,0)}°C / ${n(gpu.power_w,1)}W</span>
    </div>` : '<div class="muted">没有检测到 NVIDIA 显卡</div>';

  /* --- 3. CPU（本模型 prefill 的瓶颈所在）--- */
  const cpuTile = `
    <div class="big">${n(sys.cpu_percent,1)}<small>% 系统</small></div>
    ${meter(sys.cpu_percent, `${sys.cpu_count||'?'} 个逻辑核心`)}
    <div class="mini" style="margin-top:8px">
      <span class="k">后端进程 CPU</span>
      <span class="v ${(proc.cpu_percent||0)>200?'w':''}">${n(proc.cpu_percent,1)}%<span class="sub"> 单核口径</span></span>
      <span class="k">占总算力</span><span class="v">${n(proc.cpu_percent_of_total,1)}%</span>
      <span class="k">累计 CPU 时间</span><span class="v">${n(proc.cpu_seconds,0)} s</span>
    </div>
    <div class="sub" style="margin-top:6px">专家权重在内存里做 GEMM，prefill 主要吃 CPU</div>`;

  /* --- 4. 内存（专家权重的家）--- */
  const memTile = `
    <div class="big">${n(mem.used_gib,1)}<small>/ ${n(mem.total_gib,1)} GiB</small></div>
    ${meter(mem.percent, `已用 ${n(mem.percent,1)}%　可用 ${n(mem.avail_gib,1)} GiB`)}
    <div class="mini" style="margin-top:8px">
      <span class="k">后端进程工作集</span><span class="v">${gi(proc.working_set_gib)}</span>
      <span class="k">工作集峰值</span><span class="v">${gi(proc.peak_working_set_gib)}</span>
      <span class="k">提交量</span><span class="v">${gi(proc.commit_gib)}</span>
      <span class="k">提交上限可用</span><span class="v">${gi(mem.commit_avail_gib,1)}</span>
    </div>`;

  /* --- 5. KV cache / 上下文（200K 的关键指标，从 /slots 推得）--- */
  const kvp = (be.kv_cache_usage_ratio||0)*100;
  const slot = (be.slots||[])[0] || {};
  const kvTile = `
    <div class="big">${n(kvp,2)}<small>% KV 占用</small></div>
    ${meter(kvp, `${be.kv_cache_tokens!==null&&be.kv_cache_tokens!==undefined
        ? Number(be.kv_cache_tokens).toLocaleString() : '—'} / ${be.context_total
        ? Number(be.context_total).toLocaleString() : '—'} token`)}
    <div class="mini" style="margin-top:8px">
      <span class="k">上下文上限</span><span class="v">${be.context_total?(be.context_total/1024).toFixed(0)+'K':'—'}</span>
      <span class="k">槽位状态</span><span class="v">#${slot.id??'—'} ${slot.state||'—'}</span>
      <span class="k">槽内已解码</span><span class="v">${slot.n_decoded!==null&&slot.n_decoded!==undefined?Number(slot.n_decoded).toLocaleString():'—'}</span>
      <span class="k">命中前缀缓存</span><span class="v">${be.prompt_tokens_cached_total!==null&&be.prompt_tokens_cached_total!==undefined?Number(be.prompt_tokens_cached_total).toLocaleString():'—'} token</span>
      <span class="k">正在处理 / 排队</span>
      <span class="v ${(be.requests_deferred||0)>0?'w':''}">${be.requests_processing??'—'} / ${be.requests_deferred??'—'}</span>
      <span class="k">历史最大 token</span><span class="v">${be.n_tokens_max!==null&&be.n_tokens_max!==undefined?Number(be.n_tokens_max).toLocaleString():'—'}</span>
    </div>`;

  /* --- 6. 网关 --- */
  const errRate = gw.requests_total ? ((gw.requests_failed||0)+(gw.requests_rejected||0))/gw.requests_total*100 : 0;
  const gwTile = `
    <div class="big">${gw.requests_total??'—'}<small>次请求</small></div>
    <div class="mini" style="margin-top:8px">
      <span class="k">活跃 / 排队</span><span class="v">${gw.requests_active??'—'} / ${gw.queue_waiting??'—'}</span>
      <span class="k">失败 / 被拒</span>
      <span class="v ${errRate>0?'e':''}">${gw.requests_failed??'—'} / ${gw.requests_rejected??'—'}（${n(errRate,1)}%）</span>
      <span class="k">延迟 P50 / P95</span>
      <span class="v">${n(gw.latency_p50_seconds,2)}s / ${n(gw.latency_p95_seconds,2)}s</span>
      <span class="k">累计 in / out token</span>
      <span class="v">${(gw.prompt_tokens_total||0).toLocaleString()} / ${(gw.completion_tokens_total||0).toLocaleString()}</span>
      <span class="k">网关平均生成速率</span>
      <span class="v">${n(gw.avg_completion_tokens_per_second,2)} tok/s</span>
      <span class="k">网关运行时长</span><span class="v">${fmtUptime(gw.uptime_seconds)}</span>
    </div>`;

  /* --- 7. 累计与模型信息 --- */
  const beTile = `
    <div class="mini">
      <span class="k">累计 prompt token</span><span class="v">${Number(be.prompt_tokens_total||0).toLocaleString()}</span>
      <span class="k">累计生成 token</span><span class="v">${Number(be.predicted_tokens_total||0).toLocaleString()}</span>
      <span class="k">累计 prefill 耗时</span><span class="v">${n(be.prompt_seconds_total,1)} s</span>
      <span class="k">累计 decode 耗时</span><span class="v">${n(be.predicted_seconds_total,1)} s</span>
      <span class="k">累计解码次数</span><span class="v">${be.n_decode_total!==null&&be.n_decode_total!==undefined?Number(be.n_decode_total).toLocaleString():'—'}</span>
      <span class="k">量化类型</span><span class="v">${be.model_ftype??'—'}</span>
      <span class="k">运行时</span><span class="v">${be.build_info||'—'}</span>
      <span class="k">后端 PID</span><span class="v">${be.pid??'—'}</span>
    </div>`;

  box.innerHTML =
      tile('实时吞吐', speedTile)
    + tile('显卡', gpuTile, gpu?gpu.name.replace('NVIDIA GeForce ','').replace(' Laptop GPU',''):'')
    + tile('CPU', cpuTile)
    + tile('内存', memTile)
    + tile('上下文 / KV cache', kvTile)
    + tile('网关', gwTile)
    + tile('累计与模型', beTile, be.state||'');

  drawChart($('chart'), m.history||[]);
}

function drawChart(cv, hist){
  if(!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || 600, h = 96;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  // 网格
  ctx.strokeStyle = '#2a333d'; ctx.lineWidth = 1;
  for(let i=0;i<=3;i++){ const y = 4 + i*(h-12)/3;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }

  const series = [
    {key:'decode_tps', color:'#3fb950'},
    {key:'prefill_tps', color:'#2f81f7'},
  ];
  const all = [];
  for(const s of series) for(const p of hist){ const v=p[s.key]; if(v!=null) all.push(v); }
  if(!all.length){
    ctx.fillStyle = '#8b98a5'; ctx.font = '12px sans-serif';
    ctx.fillText('还没有请求经过 —— 发一次推理就能看到曲线', 8, h/2);
    return;
  }
  const max = Math.max(...all) * 1.15 || 1;
  const nPts = Math.max(hist.length, 2);
  const x = i => (i/(nPts-1))*(w-2)+1;
  const y = v => (h-8) - (v/max)*(h-16);

  for(const s of series){
    ctx.strokeStyle = s.color; ctx.lineWidth = 1.6;
    ctx.beginPath();
    let started = false;
    hist.forEach((p,i)=>{
      const v = p[s.key];
      if(v==null){ started = false; return; }
      if(!started){ ctx.moveTo(x(i), y(v)); started = true; }
      else ctx.lineTo(x(i), y(v));
    });
    ctx.stroke();
  }
  ctx.fillStyle = '#8b98a5'; ctx.font = '10px sans-serif';
  ctx.fillText('峰值 ' + max.toFixed(1) + ' tok/s', 6, 11);
}
async function fetchModels(){
  $('models').innerHTML = '<div class="muted">正在扫描模型目录…</div>';
  try{
    const r = await api('/admin/models');
    const data = await r.json();
    MODELS = data.models || [];
    ROOTS = data.search_roots || [];
    if(data.error) toast('注册表读取失败：' + data.error);
  }catch(e){ MODELS = []; ROOTS = []; toast('扫描失败：'+e); }
  $('roots').textContent = ROOTS.length ? '' : '（未配置扫描目录）';
  renderRoots();
  renderModels();
}

/* ================= 扫描目录（可增删） ================= */
function renderRoots(){
  const bar = $('roots-bar');
  if(!bar) return;
  bar.innerHTML = ROOTS.map(p =>
      `<span class="chip" title="${p}"><span>${p}</span><b data-rm-root="${p}" title="移除">✕</b></span>`
    ).join('')
    + `<button id="btn-add-root">＋ 添加目录</button>`
    + (ROOTS.length ? '' : '<span class="muted">尚未添加模型目录，点左边按钮选择。</span>');
  const add = $('btn-add-root');
  if(add) add.onclick = () => openPicker(ROOTS[0] || '');
  document.querySelectorAll('b[data-rm-root]').forEach(b=>{
    b.onclick = () => removeRoot(b.dataset.rmRoot);
  });
}

function openPicker(path){
  const modal = $('picker');
  if(modal) modal.classList.add('show');
  browseTo(path || '');
}
function closePicker(){ const m = $('picker'); if(m) m.classList.remove('show'); }

async function browseTo(path){
  let data;
  try{
    const r = await api('/admin/browse?path=' + encodeURIComponent(path || ''));
    data = await r.json();
  }catch(e){ toast('读取目录失败：' + e); return; }
  if(data.error) toast(data.error);
  PICK_PARENT = data.parent || '';
  $('pick-path').value = data.path || '';
  const rows = !data.path
    ? (data.drives || []).map(d => `<div class="item" data-d="${d}">🖴 ${d}</div>`)
    : (data.dirs || []).map(d =>
        `<div class="item" data-d="${d.path}">📁 ${d.name}` +
        `${d.has_gguf ? ' <span class="tag ok">含模型</span>' : ''}</div>`);
  $('pick-list').innerHTML = rows.length ? rows.join('') : '<div class="none">（没有子目录）</div>';
  document.querySelectorAll('#pick-list .item').forEach(el=>{
    el.onclick = () => browseTo(el.dataset.d);
  });
}

async function addRoot(path){
  const r = await api('/admin/roots', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({action:'add', path})
  });
  const j = await r.json().catch(()=>({}));
  if(!j.ok){ toast(j.error || ('添加失败 HTTP ' + r.status)); return false; }
  toast('已添加：' + path);
  await fetchModels();
  return true;
}

async function removeRoot(path){
  const r = await api('/admin/roots', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({action:'remove', path})
  });
  const j = await r.json().catch(()=>({}));
  if(!j.ok){ toast(j.error || '移除失败'); return; }
  toast('已移除：' + path);
  await fetchModels();
}

function renderStatus(){
  stateBadge(STATUS.state);
  $('s-model').textContent = STATUS.alias || '—';
  $('s-ctx').textContent = STATUS.context_size
    ? (STATUS.context_size/1024).toFixed(0) + 'K' : '—';
  $('s-ub').textContent = STATUS.ubatch || '—';
  $('s-kv').textContent = STATUS.kv_type ? STATUS.kv_type + ' / ' + STATUS.kv_location : '—';
  $('s-moe').textContent = STATUS.moe_location || '—';
  $('s-load').textContent = STATUS.load_mode || '—';
  $('s-up').textContent = fmtUptime(STATUS.uptime_s);
  const g = (STATUS.gpus||[])[0];
  $('s-vram').innerHTML = g ? `${n(g.free_gib,2)} <small>/ ${n(g.total_gib,2)} GiB</small>` : '—';
  $('cmdline').textContent = STATUS.command || '—';

  const busy = !!STATUS.busy;
  $('progress').style.display = busy ? 'block' : 'none';
  if(busy) $('progress-msg').textContent = STATUS.message || '正在加载…';
  $('errbox').style.display = (!busy && STATUS.state==='error') ? 'block' : 'none';
  if(STATUS.state==='error') $('errmsg').textContent = STATUS.message || '加载失败';
  $('idlebox').style.display = (STATUS.state==='idle') ? 'block' : 'none';

  document.querySelectorAll('button[data-act="start"]').forEach(b=>{
    // 只有"确实在运行"的那个模型才把按钮禁掉；idle/error 状态下不能因为
    // active_path 残留而把某个模型的启动按钮永久锁死。
    b.disabled = busy || (STATUS.state === 'running' && b.dataset.path === STATUS.active_path);
  });
  $('btn-stop').disabled = busy || STATUS.state==='idle';
  $('btn-rescan').disabled = busy;
  document.querySelectorAll('.card').forEach(c=>{
    c.classList.toggle('active', STATUS.state === 'running' && c.dataset.path === STATUS.active_path);
  });
  // 视觉开关：加载中禁用；已就绪时按实际加载结果回填勾选状态。
  // 只在"当前模型刚变成 running"时回填一次，否则每 2 秒的轮询会把用户刚拨的
  // 开关又拨回去。
  document.querySelectorAll('input[data-vision]').forEach(i=>{ i.disabled = busy; });
  if(STATUS.state !== 'running'){
    VISION_SYNCED = null;
  }else if(STATUS.active_path !== VISION_SYNCED){
    document.querySelectorAll('input[data-vision]').forEach(i=>{
      if(i.dataset.vision === STATUS.active_path) i.checked = !!STATUS.mmproj_path;
    });
    VISION_SYNCED = STATUS.active_path || null;
  }
}

function renderModels(){
  const box = $('models');
  if(!MODELS.length){ box.innerHTML = '<div class="muted">没找到任何 .gguf 模型。检查 config/models.yaml 里的 search_roots。</div>'; return; }
  box.innerHTML = '';
  for(const m of MODELS){
    const est = m.estimate || {};
    const free = ((STATUS.gpus||[])[0]||{}).free_gib;
    const tight = free !== undefined && est.vram_total_gib !== undefined
                  && est.vram_total_gib > free - 0.3;
    const el = document.createElement('div');
    el.className = 'card' + (tight ? ' warn' : '');
    el.dataset.path = m.path;
    el.innerHTML = `
      <h3>${m.label}
        ${m.matched ? '<span class="tag ok">已标定</span>' : '<span class="tag warn">未标定</span>'}
        ${m.size_gib ? `<span class="tag">${m.size_gib.toFixed(2)} GiB</span>` : ''}
      </h3>
      <div class="fname">${m.name}</div>
      ${m.note ? `<div class="note">${m.note}</div>` : ''}
      <div class="kv">
        <span class="k">结构</span><span>${m.shape||'—'}</span>
        <span class="k">上下文</span><span>${est.context?(est.context/1024).toFixed(0)+'K':'—'}
          ${m.context_max?`<span class="muted">（训练 ${(m.context_max/1024).toFixed(0)}K）</span>`:''}</span>
        <span class="k">显存占用</span><span>${est.vram_total_gib!==undefined?est.vram_total_gib.toFixed(2)+' GiB':'—'}
          ${est.measured?'<span class="tag ok">实测</span>':'<span class="tag warn">估算</span>'}
          ${est.kv_gib!==undefined?`<span class="muted">（KV ${est.kv_gib.toFixed(2)}）</span>`:''}</span>
        <span class="k">内存占用</span><span>${est.experts_ram_gib!==undefined?est.experts_ram_gib.toFixed(2)+' GiB':'—'}</span>
        ${m.measured && m.measured.decode_tps ? `<span class="k">实测速度</span><span>decode ${m.measured.decode_tps} · prefill ${m.measured.prefill_tps||'—'} tok/s</span>` : ''}
        ${m.vision_supported ? `<span class="k">视觉组件</span><span>${baseName(m.mmproj)}</span>` : ''}
        <span class="k">模型名</span><span>${m.alias}</span>
      </div>
      <div class="actions">
        <button class="primary" data-act="start" data-path="${m.path}">启动此模型</button>
        ${m.vision_supported ? `<label class="switch" title="开启后一并加载视觉投影：${m.mmproj||''}">
            <input type="checkbox" data-vision="${m.path}"${m.vision_default?' checked':''}>
            <span class="track"></span>视觉
          </label>` : ''}
        ${m.error?`<span class="tag warn">${m.error}</span>`:''}
      </div>`;
    box.appendChild(el);
  }
  document.querySelectorAll('button[data-act="start"]').forEach(b=>{
    b.onclick = () => activate(b.dataset.path);
  });
  renderStatus();
}

async function activate(path){
  const m = MODELS.find(x=>x.path===path);
  const vision = visionWanted(path);   // undefined = 该模型无视觉组件
  const extra = vision===undefined ? '' : (vision ? '\n（含视觉组件）' : '\n（不含视觉组件）');
  if(!confirm(`确定启动「${m?m.label:path}」？${extra}\n\n如果已有模型在跑，会先停掉它再加载新的（约 10-15 秒）。`)) return;
  const payload = { path };
  if(vision !== undefined) payload.vision = vision;
  try{
    const r = await api('/admin/activate', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    const j = await r.json().catch(()=>({}));
    if(!j.ok) toast(j.error || ('启动失败 HTTP ' + r.status));
    else { $('progress').style.display='block'; $('progress-msg').textContent='已受理，正在加载…'; }
  }catch(e){ toast('请求失败：'+e); }
  fetchStatus();
}

/* 卡片上的视觉开关：只有检测到 mmproj 的模型才有这个 input。
   返回 true/false；模型没有视觉组件时返回 undefined（请求里就不带 vision 字段）。 */
function visionWanted(path){
  const inputs = document.querySelectorAll('input[data-vision]');
  for(const el of inputs){ if(el.dataset.vision === path) return !!el.checked; }
  return undefined;
}

$('btn-stop').onclick = async () => {
  if(!confirm('停止当前的 llama-server？（网页控制台会保留，随时可以再启动）')) return;
  const r = await api('/admin/stop', {method:'POST'});
  const j = await r.json().catch(()=>({}));
  if(!j.ok) toast(j.error||'停止失败');
  fetchStatus();
};
$('btn-rescan').onclick = fetchModels;
$('btn-key').onclick = () => {
  const k = prompt('设置 API Key（留空表示不使用鉴权）：', getKey());
  if(k === null) return;
  setKey(k.trim());
  toast(k.trim() ? '已保存 API Key' : '已清除 API Key');
  fetchStatus();
};
$('btn-log').onclick = async () => {
  const r = await api('/admin/log?lines=80');
  const j = await r.json().catch(()=>({tail:''}));
  $('log').textContent = j.tail || '（没有日志）';
};
$('btn-copy').onclick = () => {
  const url = location.origin + '/v1';
  navigator.clipboard?.writeText(url).then(
    ()=>toast('已复制：' + url),
    ()=>toast('复制失败，手动复制：' + url));
};

/* ---------- 目录选择器 ---------- */
$('pick-cancel').onclick = closePicker;
$('pick-up').onclick = () => browseTo(PICK_PARENT || '');
$('pick-go').onclick = () => browseTo(($('pick-path').value || '').trim());
$('pick-add').onclick = async () => {
  const p = ($('pick-path').value || '').trim();
  if(!p){ toast('请先选择或输入一个目录'); return; }
  if(await addRoot(p)) closePicker();
};
$('picker').onclick = e => { if(e.target && e.target.id === 'picker') closePicker(); };

(async function init(){
  await fetchModels();
  await fetchStatus();
  await fetchMetrics();
  pollTimer = setInterval(async () => {
    // 上一轮没跑完（例如后端在忙）或页面在后台时跳过这一拍，避免请求堆叠；
    // 堆叠会让 /admin/metrics 的采样交错，算出荒谬的实时速度。
    if(polling || document.hidden) return;
    polling = true;
    try{
      await fetchStatus();
      await fetchMetrics();
    }catch(e){
      console.error('轮询失败：', e);
    }finally{
      polling = false;
    }
  }, 2000);
})();
</script>
