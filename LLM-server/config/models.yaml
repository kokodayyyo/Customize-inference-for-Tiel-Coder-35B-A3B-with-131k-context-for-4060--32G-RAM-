# 多模型注册表
# ============================================================
# 网页界面会扫描下面的 search_roots，把找到的 GGUF 列出来；
# 每个模型匹配到一条 profile 后，点一下就用**这套调好的参数**启动后端。
#
# 匹配规则（按优先级）：
#   1. profile.path   与模型**完整路径**相同（忽略大小写与斜杠方向）
#   2. profile.match  与**文件名（不含 .gguf）完全相同**
#   3. profile.match  作为**子串**出现在文件名里
# 都没匹配上就用 default_profile。
#
# 视觉（mmproj）：模型**同目录**下的 mmproj*.gguf 会被自动识别，网页卡片上出现
# 「视觉」开关（默认关，打开才加载）。想指定别的文件、或让它默认开启，就在该
# profile 的 settings 里写 mmproj_path。
#
# settings 里的键名与 config/server.yaml 完全一致，只是按模型覆盖。
# ============================================================

# 扫描哪些目录找模型（递归）。
# 这是**默认值**：网页控制台里可以增删扫描目录，改动存到同目录的
# model_roots.json，存在时它会覆盖这里的 search_roots（不会改坏本文件注释）。
search_roots:
  - "D:/models"

# 扫描时忽略的目录名片段（避免翻进缓存/回收站之类）
ignore_dirs:
  - ".cache"
  - "$RECYCLE.BIN"
  - "System Volume Information"

# 找不到匹配 profile 时用的兜底参数（保守，保证能起来）
default_profile:
  label: "未标定模型"
  note: "没有匹配到已调优的 profile，使用保守默认值。建议跑 scripts/moe_sweep.py 标定后写进配置。"
  settings:
    context_size: 32768
    cpu_moe: true
    n_cpu_moe: -1
    ubatch_size: 1024
    batch_size: 4096
    kv_cache_type_k: "q8_0"
    kv_cache_type_v: "q8_0"
    kv_offload: true
    load_mode: "none"
    threads: 16
    gpu_layers: 99

profiles:

  # ----------------------------------------------------------
  # Tile-35B-A3B 基准版（IQ4_XS，16.9 GiB，带 MTP 头）
  #
  # 完整标定（ctx=131072，真实中文提示，见 NOTES 第 4 章三轮扫描）：
  #   decode  空载 28.3 → 填 95.8K 后 19.9 tok/s
  #   prefill 928 ~ 1068 tok/s
  #   显存净增 4.41 GiB（比 apex 少 0.7 GiB，因为 128K 的 KV 少 0.75 GiB）
  #
  # 量化 IQ3_S(8.59G)+IQ4_XS(4.91G)，比 apex 高，**回答质量更好**。
  # 代价是文件大 3.1 GiB、decode 慢约 20%、上下文上限只有 128K。
  # ----------------------------------------------------------
  - match: "Cyber-Tiel-Coder-35B-A3B-MTP-UD-IQ4_XS"
    label: "Tile 35B-A3B 基准版"
    note: "IQ4_XS / 16.9 GiB / 128K。质量更好，速度略低、上下文更短。含 0.36 GiB 被忽略的 MTP 头。"
    settings:
      model_alias: "tile-35b-a3b"
      context_size: 131072      # 128K：KV q8_0 需 1.33 GiB
      cpu_moe: true             # 专家 14.12 GiB 放内存
      # 128K 下显存余量比 apex 大，n_cpu_moe=36 实测 decode +6%（29.19→30.93）
      # 且总占用只到 6768 MiB，安全。**42 以上或 32 会崩**，别越界。
      n_cpu_moe: -1             # 想再快 6% 可设 36（必须同时保持 ubatch 2048）
      ubatch_size: 2048
      batch_size: 8192
      kv_cache_type_k: "q8_0"
      kv_cache_type_v: "q8_0"
      kv_offload: true
      load_mode: "none"
      threads: 16
      gpu_layers: 99
      # 同目录的 mmproj-BF16.gguf 会被自动识别；这里显式写 = 指定文件且默认开启
      # mmproj_path: "D:/models/Tile/Tile-35BA3B/mmproj-BF16.gguf"
    # **实测**值（有别于上面的理论估算）。界面会优先显示这些。
    # 原因：理论公式在基准版上分毫不差，在 apex 上却偏低 0.76 GiB，不能当依据。
    measured:
      vram_gib: 4.41            # 净增（moe_sweep u2048）
      ram_working_set_gib: 15.6
      decode_tps: 29.2          # 空载
      prefill_tps: 1049
      decode_at_95k: 19.9       # 填充 9.6 万 token 后

  # ----------------------------------------------------------
  # Tile-35B-A3B APEX（13.7 GiB，无 MTP 头，40 层）
  #
  # 完整标定（ctx=204800，真实中文提示，见 NOTES 4.8）：
  #   decode  空载 30.5 → 填 153K 后 17.7 tok/s（只掉 42%）
  #   prefill 845 ~ 1137 tok/s
  #   显存净增 5.14 GiB，长上下文填充期间保持平坦（6606 → 6990 MiB）
  #
  # 与基准版的关键差别**只有量化**：模板、层数、注意力结构、rope 参数
  # 全部逐项比对过，完全一致。apex 用 Q3_K(6.75G)+IQ3_XXS(5.74G)，
  # 基准版用 IQ3_S(8.59G)+IQ4_XS(4.91G)，所以**回答质量确实更低**——
  # 这是文件本身的性质，不是参数没调好。
  # ----------------------------------------------------------
  - match: "Cyber-Tiel-Coder-35B-A3B.APEX-I-MiniPlus-V2.1"
    label: "Tile 35B-A3B APEX"
    note: "Q3_K+IQ3_XXS / 13.7 GiB / 200K。更快更省，但量化更低、回答质量不如基准版。"
    settings:
      model_alias: "tile-35b-a3b-apex"
      context_size: 204800      # 200K：KV q8_0 仅 2.03 GiB（10 个全注意力层）
      cpu_moe: true             # 专家 12.19 GiB 放内存
      # 实测 n_cpu_moe=36 只 +3.4% decode（基准版是 +6%），却把显存推到 7531 MiB
      # ——离 7894 MiB 的崩盘线只剩 363 MiB。apex 上**不值得**，保持 -1。
      # 基准版因为余量更大（显存只到 6768 MiB）才建议开。
      n_cpu_moe: -1
      # ubatch 的坑在 apex 上更明显：合成 8K 英文提示下 4096 看着快 15%，
      # 换成真实中文长提示后 prefill 只有 505~825 tok/s（2048 是 890~1137），
      # 慢 40%，且显存冲到 7582~7784 MiB（只剩 376 MiB）。
      # 4096 从来不是更快，只是挑提示。**固定用 2048。**
      ubatch_size: 2048
      batch_size: 8192
      kv_cache_type_k: "q8_0"
      kv_cache_type_v: "q8_0"
      kv_offload: true
      load_mode: "none"
      threads: 16
      gpu_layers: 99
      # 同目录的 mmproj-Q8_0.gguf 会被自动识别；这里显式写 = 指定文件且默认开启
      # mmproj_path: "D:/models/Tile/Tile-35BA3B apex/mmproj-Q8_0.gguf"
    # **实测**值。理论公式在这里偏低 0.76 GiB，所以界面显示实测值。
    # 数据来源：scripts/stress_ctx.py + scripts/moe_sweep.py
    measured:
      vram_gib: 5.02            # 净增 @200K（公式只算 4.27，偏低 0.75）
      vram_gib_128k: 3.85       # 净增 @128K（公式算 3.57，偏低 0.28）
      ram_working_set_gib: 14.2
      decode_tps: 30.5          # 空载
      prefill_tps: 1137
      decode_at_153k: 17.7      # 填充 15.3 万 token 后
      first_token_at_153k_s: 181

  # ----------------------------------------------------------
  # Gemma-4 26B-A4B Heretic APEX（gemma4 架构，14.43 GiB，APEX 混合量化）
  # 匹配用**家族子串**（Gemma-4-26B-A4B）—— 换同族量化不用改配置。
  #
  # 结构：30 层、MoE 128 专家 / 激活 8（专家 FFN 704）；注意力是**滑窗**
  # （window 1024），每 6 层才 1 层全注意力 —— 30 层里只有 5 层 KV 随上下文
  # 增长，所以 KV 很小（q8_0 @150K 仅 1.66 GiB）。
  #
  # 张量账本（scripts/gguf_tensors.py）：
  #   专家 *_exps   12.88 GiB -> 内存
  #   其余权重       1.54 GiB -> 显存
  #
  # 实测（scripts/moe_probe.py，150K，cpu-moe，q8_0 KV，ubatch 2048，load none）：
  #   decode 29.3 tok/s | prefill 1324 tok/s | 显存净增 5.03 GiB | 进程工作集 14.9 GiB
  #   注：prefill 与上下文基本无关（都 ~1300~1380）；8 GiB 卡的瓶颈是显存总量，
  #       大上下文把总量顶到 ~7.9 GiB 就会让 prefill 崩（见 README/NOTES）。
  #       专家已在内存、resident 很小，没有可挪腾的余量，故 n_cpu_moe 保持 -1。
  # ----------------------------------------------------------
  - match: "Gemma-4-26B-A4B"
    label: "Gemma 4 26B-A4B Heretic APEX"
    note: "gemma4 MoE / APEX 混合量化 / 14.43 GiB / 150K。专家放内存、注意力+KV 放显存；滑窗注意力使 KV 很小。"
    settings:
      model_alias: "gemma-4-26b-a4b"
      context_size: 153600      # 150K：KV q8_0 仅 1.66 GiB（5 个全注意力层）
      cpu_moe: true             # 专家 12.88 GiB 放内存
      n_cpu_moe: -1             # 显存余量小，不适合再把专家挪上显存
      ubatch_size: 2048
      batch_size: 8192
      kv_cache_type_k: "q8_0"
      kv_cache_type_v: "q8_0"
      kv_offload: true
      load_mode: "none"
      threads: 16
      gpu_layers: 99
    # **实测**值（scripts/moe_probe.py）。界面优先显示这些。
    measured:
      vram_gib: 5.03            # 净增 @150K（cpu-moe，5153 MiB）
      ram_working_set_gib: 14.9
      decode_tps: 29.3          # 空载
      prefill_tps: 1324
